<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Inventory forecasting and optimization background</title>
  <desc id="desc">Forecasting dashboard with demand curves, safety stock bands, reorder points, and inventory optimization signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101a"/><stop offset="0.48" stop-color="#142619"/><stop offset="1" stop-color="#030412"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#fff"><path d="M100 150h1060M100 280h1060M100 410h1060M100 540h1060M100 670h1060"/><path d="M180 90v620M340 90v620M500 90v620M660 90v620M820 90v620M980 90v620M1140 90v620"/></g>
  <g transform="translate(120 120)">
