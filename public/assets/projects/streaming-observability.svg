    <text x="126" y="182" fill="#fff" font-size="26">Events</text>
    <rect x="370" y="266" width="190" height="112" rx="22" stroke="#f3f4f6"/>
    <text x="414" y="332" fill="#fff" font-size="26">Kafka</text>
    <rect x="650" y="156" width="190" height="112" rx="22" stroke="#33c2cc"/>
    <text x="694" y="222" fill="#fff" font-size="26">Flink</text>
    <rect x="930" y="286" width="250" height="230" rx="28" stroke="#f9d94a"/>
  </g>
  <g transform="translate(970 330)" font-family="Arial">
    <text fill="#fff" font-size="26" font-weight="700">Observability</text>
    <text y="38" fill="#9fb4d7" font-size="18">freshness</text><rect x="126" y="20" width="72" height="18" rx="9" fill="#57db96"/>
    <text y="78" fill="#9fb4d7" font-size="18">schema drift</text><rect x="126" y="60" width="48" height="18" rx="9" fill="#f9d94a"/>
    <text y="118" fill="#9fb4d7" font-size="18">SLA health</text><rect x="126" y="100" width="86" height="18" rx="9" fill="#33c2cc"/>
  </g>
  <g opacity="0.75">
