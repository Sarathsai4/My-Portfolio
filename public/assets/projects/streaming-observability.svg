<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Streaming and observability platform background</title>
  <desc id="desc">Event streams flow through Kafka and Flink into monitoring dashboards for freshness, schema drift, and SLA health.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050717"/><stop offset="0.55" stop-color="#081d2c"/><stop offset="1" stop-color="#030412"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#fff"><path d="M0 180h1280M0 320h1280M0 460h1280M0 600h1280"/><path d="M160 0v820M320 0v820M480 0v820M640 0v820M800 0v820M960 0v820M1120 0v820"/></g>
  <g filter="url(#glow)">
    <path d="M80 230C250 130 350 330 520 230s305-120 680 20" fill="none" stroke="#33c2cc" stroke-width="7" stroke-linecap="round"/>
    <path d="M80 410C250 310 350 510 520 410s305-120 680 20" fill="none" stroke="#7a57db" stroke-width="7" stroke-linecap="round"/>
    <path d="M80 590C250 490 350 690 520 590s305-120 680 20" fill="none" stroke="#57db96" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g fill="#0b1222" stroke-width="3" font-family="Arial" font-weight="700">
