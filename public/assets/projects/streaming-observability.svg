    <circle cx="742" cy="212" r="8" fill="#57db96"/><circle cx="980" cy="388" r="8" fill="#f9d94a"/>
  </g>
  <text x="82" y="720" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Near real-time monitoring across event pipelines</text>
