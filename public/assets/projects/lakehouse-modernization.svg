<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise lakehouse modernization background</title>
  <desc id="desc">A modern data lakehouse with bronze, silver, and gold zones, Delta Lake tables, and Spark compute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040915"/>
      <stop offset="0.5" stop-color="#102236"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33c2cc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a57db" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <path d="M0 550C190 450 315 590 520 502s342-138 760 28v290H0z" fill="url(#lake)"/>
  <g opacity="0.18" stroke="#fff">
    <path d="M80 118h1120M80 242h1120M80 366h1120M80 490h1120"/>
    <path d="M170 70v590M350 70v590M530 70v590M710 70v590M890 70v590M1070 70v590"/>
  </g>
  <g transform="translate(110 170)" filter="url(#glow)">
    <rect width="270" height="160" rx="26" fill="#1c1720" stroke="#cc6033" stroke-width="3"/>
    <text x="38" y="58" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Bronze</text>
    <text x="38" y="96" fill="#d6995c" font-family="Arial" font-size="20">raw operational data</text>
    <circle cx="220" cy="80" r="34" fill="#cc6033" opacity="0.2"/>
  </g>
  <g transform="translate(500 300)" filter="url(#glow)">
    <rect width="270" height="160" rx="26" fill="#151d27" stroke="#33c2cc" stroke-width="3"/>
    <text x="38" y="58" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Silver</text>
    <text x="38" y="96" fill="#b8f5ff" font-family="Arial" font-size="20">cleansed parquet layers</text>
    <path d="M206 44l42 24-42 24-42-24zM206 92l42 24-42 24-42-24z" fill="none" stroke="#33c2cc" stroke-width="5"/>
  </g>
  <g transform="translate(890 170)" filter="url(#glow)">
    <rect width="270" height="160" rx="26" fill="#201d14" stroke="#f9d94a" stroke-width="3"/>
    <text x="38" y="58" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Gold</text>
    <text x="38" y="96" fill="#f9d94a" font-family="Arial" font-size="20">analytics data marts</text>
    <rect x="188" y="52" width="18" height="66" rx="5" fill="#f9d94a"/><rect x="218" y="78" width="18" height="40" rx="5" fill="#57db96"/>
  </g>
  <path d="M380 250C460 250 470 360 500 380M770 380C835 360 820 255 890 250" fill="none" stroke="#57db96" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18"/>
  <g transform="translate(480 590)">
    <rect width="320" height="88" rx="24" fill="#0b1222" stroke="#ff3434" stroke-width="3"/>
    <path d="M58 22l48 26-48 26-48-26z" fill="none" stroke="#ff3434" stroke-width="6"/>
    <text x="132" y="56" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Delta Lakehouse</text>
  </g>
  <g transform="translate(78 640)" fill="#fff" font-family="Arial">
    <text font-size="22" font-weight="700">Spark + Glue + EMR</text>
    <text y="32" font-size="18" fill="#9fb4d7">schema evolution, partitions, validation gates</text>
  </g>
</svg>
