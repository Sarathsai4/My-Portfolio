    <path d="M52 78c34-44 89-44 123 0" fill="none" stroke="#f4a742" stroke-width="11" stroke-linecap="round"/>
    <text x="54" y="55" fill="#fff" font-family="Arial" font-size="26" font-weight="700">S3</text>
  </g>
  <g transform="translate(690 210)">
    <rect width="180" height="120" rx="24" fill="#10192b" stroke="#33c2cc" stroke-width="3"/>
    <circle cx="62" cy="62" r="26" fill="#33c2cc" opacity="0.22"/>
    <path d="M62 38v48M38 62h48" stroke="#33c2cc" stroke-width="8" stroke-linecap="round"/>
    <text x="108" y="70" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Glue</text>
  </g>
  <g transform="translate(940 210)">
