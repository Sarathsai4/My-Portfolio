<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Kindle ETL and analytics pipeline background</title>
  <desc id="desc">A cloud ETL diagram with Kindle review events flowing into S3, Glue, Redshift, and BI dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0d2538"/>
      <stop offset="1" stop-color="#050712"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33c2cc" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#33c2cc"/>
      <stop offset="1" stop-color="#57db96" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 150h1280M0 300h1280M0 450h1280M0 600h1280" stroke="#fff"/>
    <path d="M120 0v820M300 0v820M480 0v820M660 0v820M840 0v820M1020 0v820M1200 0v820" stroke="#fff"/>
  </g>
  <g filter="url(#glow)">
    <path d="M170 410C320 260 475 260 600 410s290 150 450-4" fill="none" stroke="url(#line)" stroke-width="7"/>
    <path d="M170 498C345 640 498 604 640 488s246-126 450 12" fill="none" stroke="#7a57db" stroke-width="3" opacity="0.7"/>
  </g>
  <g transform="translate(120 185)">
    <rect width="220" height="300" rx="24" fill="#08101f" stroke="#33c2cc" stroke-opacity="0.65" stroke-width="3"/>
    <rect x="34" y="36" width="152" height="210" rx="10" fill="#111a2f" stroke="#fff" stroke-opacity="0.16"/>
    <path d="M62 86h94M62 122h112M62 158h78M62 194h104" stroke="#f9d94a" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <text x="36" y="278" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Kindle Reviews</text>
  </g>
  <g transform="translate(430 210)">
