    <rect width="250" height="150" rx="24" fill="#0c1426" stroke="#57db96" stroke-opacity="0.7" stroke-width="3"/>
    <rect x="42" y="82" width="28" height="42" rx="6" fill="#57db96"/>
    <rect x="88" y="60" width="28" height="64" rx="6" fill="#33c2cc"/>
    <rect x="134" y="36" width="28" height="88" rx="6" fill="#f9d94a"/>
